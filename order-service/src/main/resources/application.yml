server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: saga
    password: saga
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # outbox already holds JSON text
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.order.event.OrderEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"

saga:
  order-timeout-seconds: 120      # SagaTimeoutJob cancels orders stuck in CREATED longer than this

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: order-service
    urls:                         # one UI, three services (payment/inventory allow CORS from :8081)
      - name: order-service
        url: /v3/api-docs
      - name: payment-service
        url: http://localhost:8082/v3/api-docs
      - name: inventory-service
        url: http://localhost:8083/v3/api-docs

logging:
  level:
    org.apache.kafka: WARN
